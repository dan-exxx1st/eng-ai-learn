services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devlingo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devlingo}
      POSTGRES_USER: ${POSTGRES_USER:-devlingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlingo_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devlingo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: devlingo-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: devlingo-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-devlingo}
      DB_USER: ${POSTGRES_USER:-devlingo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devlingo_secret}
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-at-least-256-bits-long-change-in-production}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: devlingo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
  uploads:
